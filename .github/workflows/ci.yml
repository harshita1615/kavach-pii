name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  extension:
    # The TypeScript core must match the Python package exactly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Rules and parity fixture are up to date with the Python package
        run: |
          python scripts/export_rules.py
          python scripts/export_parity.py
          git diff --exit-code -- extension/src/core/rules.json extension/test/fixtures/parity.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run typecheck
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: npm run package
        working-directory: extension
      - name: Website demo bundle is up to date
        run: |
          npm run build:demo
          git diff --exit-code -- ../docs/demo/demo.js
        working-directory: extension
      - uses: actions/upload-artifact@v4
        with:
          name: kavach-extension
          path: extension/kavach-extension-*.zip

  benchmark:
    # Kavach only; the Presidio comparison needs a 400 MB spaCy model and is run locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m benchmark.run_eval | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark/results/
