name: Release

# Push a tag like v0.1.0 to publish to PyPI.
# Run manually (Actions tab -> Release -> Run workflow) to publish to TestPyPI.
# Uses trusted publishing: no API tokens are stored in the repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/kavach/__init__.py').read()).group(1))")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          echo "PAN ABCPE1234F" | /tmp/smoke/bin/kavach redact | grep -q "\[PAN_1\]"
          /tmp/smoke/bin/python -c "import kavach, sys; assert 'mcp' not in sys.modules"
          /tmp/smoke/bin/pip install "$(ls dist/*.whl)[mcp]"
          /tmp/smoke/bin/kavach-mcp --version
          /tmp/smoke/bin/python -c "from pathlib import Path; from kavach.mcp_server import Workspace, build_server; build_server(Workspace([Path('.')]))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
