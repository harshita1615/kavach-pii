[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kavach-pii"
dynamic = ["version"]
description = "Detect, mask and restore Indian PII (Aadhaar, PAN, UPI, bank details) before it reaches an LLM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Harshita Chaudhary", email = "work.harshitachaudhary@gmail.com" }]
keywords = [
    "pii",
    "privacy",
    "llm",
    "redaction",
    "masking",
    "india",
    "aadhaar",
    "pan",
    "upi",
    "gstin",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Text Processing :: Filters",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/harshita1615/kavach-pii"
Source = "https://github.com/harshita1615/kavach-pii"
Issues = "https://github.com/harshita1615/kavach-pii/issues"
Benchmark = "https://github.com/harshita1615/kavach-pii/tree/main/benchmark"
Changelog = "https://github.com/harshita1615/kavach-pii/blob/main/CHANGELOG.md"

[project.scripts]
kavach = "kavach.cli:main"
kavach-mcp = "kavach.mcp_server:main"

[project.optional-dependencies]
# The MCP server (kavach-mcp). The core library never imports it.
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8", "ruff>=0.6", "mcp>=2.3,<3"]
# Only for regenerating the dataset and comparing with Presidio; never needed at runtime.
benchmark = ["faker>=30", "presidio-analyzer>=2.2"]

[tool.hatch.version]
path = "src/kavach/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kavach"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "benchmark/", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# One template per line reads better than wrapped strings.
"benchmark/generators/templates.py" = ["E501"]
